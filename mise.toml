# The one place a tool version is written. `mise install` installs what this file names, and
# `mise run ci` is the gate.
#
# What the BUILD resolves is not here: plugins, libraries and the platform floors live in
# gradle/libs.versions.toml, because Gradle resolves those and mise does not. What RUNS the
# build is: the JDK, Gradle itself and the Android SDK's command-line tools.
#
# Every pin is the newest stable release that works. Where a newer one exists and does not
# work, the comment beside the pin names what stops it. `min_version` is a floor, not a pin.
#
# Kept to what mise loads without being asked to trust the file: `min_version`, plain version
# strings, and tasks with no template in them.

min_version = "2026.9.15"

[tools]
# The JDK the build runs on and compiles with. The bytecode a consumer receives targets the
# floor the version catalog names, which is lower. JDK 27 is out, but the Kotlin the version
# catalog pins cannot yet compile on it: its newest JVM target is 26, so it falls back to a 26
# target and the build stops on the mismatch with Java's 27.
java = "temurin-26.0.2.1+1"

# Gradle is run through the wrapper, and the wrapper is generated by this Gradle and never
# written by hand. The root task `checkWrapper` fails when the two disagree, so moving this
# pin is followed by `mise run wrapper`.
gradle = "9.9.1"

# The Android SDK's command-line tools, which include the `android` command. The platform,
# the build tools, the emulator and its system image are installed by the two `android:*`
# tasks below, each at the exact version written there. `android sdk install` asks nothing, but
# records each package's licence as accepted in the SDK's `licenses/` directory, so running
# either task accepts those licences: both are the person's to run.
android-sdk = "23.0"
# Reads CI's runs and runs its gate on local changes (`depot ci run --workflow .depot/workflows/ci.yml`).
depot = "2.103.29"
# Fetches, in CI, the git bundles of the siblings siblings.lock pins (`sh .agents/siblings checkout`).
oras = "1.4.0"

[tasks.wrapper]
description = "Regenerate the Gradle wrapper from the pinned Gradle"
run = "gradle wrapper --gradle-version 9.9.1 --distribution-type bin --gradle-distribution-sha256-sum d8a18a7a841dd5df825d35a685fad6f2d7f12ac0c280e57b67c27b4a520ba228"

[tasks."android:packages"]
description = "Install the Android platform and build tools the build compiles against"
run = "android sdk install platform-tools@37.0.3 platforms/android-37.0@2.0.0 build-tools/37.0.0"

[tasks."android:emulator"]
description = "Install the emulator and the system image the device tests run on"
run = [
  "android sdk install emulator@37.3.10 system-images/android-37.0/google_apis/arm64-v8a@8.0.0",
  "avdmanager create avd --force --name mountaya-api37 --package 'system-images;android-37.0;google_apis;arm64-v8a' --device pixel_7",
]

# What this repository's builds left behind and no longer use, inside the repository and nowhere
# else: Gradle's state for a version the wrapper no longer names, and the build output of a
# directory that holds no build any more. The gate runs it first. `mise run clean -- --all` also
# deletes this repository's build directories, and `mise run clean -- --dry-run` only lists.
[tasks.clean]
description = "Delete what this repository's builds left behind and no longer use, inside it alone; --all deletes the build directories too"
run = "bash scripts/clean.sh"

# The toolchains every checkout on this machine shares, outside the repository: a Gradle version no
# Mountaya wrapper names and no daemon ran this week, a Kotlin/Native toolchain for a Kotlin no
# checkout pins, an Android system image, platform or NDK no checkout names (the newest NDK kept),
# mise's installs of Gradle and the Android SDK at a version none pins or uses, and a `mountaya-*`
# emulator device no checkout creates. It lists them and the room they hold; `mise run
# clean:toolchains -- --yes` deletes them, never a path a running process holds open. It is the
# person's to run, never an agent's, and the gate never runs it.
[tasks."clean:toolchains"]
description = "List the shared toolchains no Mountaya checkout pins or uses any more; -- --yes deletes them. Yours to run, never an agent's"
run = "bash scripts/clean-toolchains.sh"

[tasks."disk:check"]
description = "Refuse to start the gate where the disk it builds on lacks room for it"
run = "bash scripts/check-disk.sh"

# The toolchain this repository builds on and mise cannot install, asserted rather than installed:
# Xcode, whose tools build the iOS klibs on macOS, at the version written here; and the JDK
# ./gradlew starts Gradle on, held to the `java` pin above.
[tasks."toolchain:check"]
description = "Refuse a toolchain other than the pinned one: the JDK ./gradlew starts Gradle on, and Xcode on macOS"
run = "bash scripts/check-toolchain.sh 27.2"

# The gate, which CI runs on every push: it deletes what this repository's builds left behind and no
# longer use, checks the disk has room and the toolchain is the pinned one, then Gradle's `verify`: every gate, the
# app-size gate after the consumer build it measures, and the capability coverage gate last.
[tasks.ci]
description = "The gate: clean, the disk check, the toolchain check, then every Gradle gate, the app-size gate after checkConsumer and the capability coverage gate last"
run = [{ task = "clean" }, { task = "disk:check" }, { task = "toolchain:check" }, "./gradlew verify"]

# The app-size gate alone, which `verify` runs after `checkConsumer`: Trail's release build (examples/trail),
# its dex code read package by package with the command-line tools' apkanalyzer, each module's share and each
# library's the SDK brings held to examples/trail/size/android.json at the version of sdk/trail.yaml it records.
# `MOUNTAYA_SIZE_BASELINE=write mise run size:check` records the figures after a deliberate change.
[tasks."size:check"]
description = "The app-size gate alone: Trail's dex code, module by module, against examples/trail/size/android.json"
run = "./gradlew checkAppSize"

[tasks."ci:coverage"]
description = "The capability coverage gate alone: every capability has a runner or a scope sentence"
run = "./gradlew checkConformanceCoverage"

[tasks."test:device"]
description = "The tests that need an Android emulator running: each module's device tests and Trail's journey"
run = [{ task = "disk:check" }, "./gradlew verifyDevice"]

# Trail's session server (examples/trail/session): it reads MOUNTAYA_PUBLISHABLE_KEY and MOUNTAYA_SECRET_KEY from
# the shell, listens on 127.0.0.1:8787 alone, which the Android emulator reaches at 10.0.2.2:8787, and answers
# POST /session with the session postSession mints, so the secret key never reaches the app.
[tasks."trail:session"]
description = "Trail's session server on 127.0.0.1:8787, minting the app's session tokens with the keys in your shell"
run = "./gradlew -p examples/trail --quiet :session:run"

[tasks.generate]
description = "Print the generated surface, the core's and the admin unit's, from sdk/model.json, and the elements' data from sdk/elements/, of the sibling schemas checkout"
run = "./gradlew :mountaya-client:generateClient :mountaya-admin:generateClient :mountaya-geo:generateElements"

[tasks."generate:check"]
description = "Fail where the generated surface or the elements' data differ from what sdk/model.json and sdk/elements/ print"
run = "./gradlew :mountaya-client:generateClient --check :mountaya-admin:generateClient --check :mountaya-geo:generateElements --check"

[tasks.consumer]
description = "Build the consumer against the modules' public surface, the README's snippets with it"
run = "./gradlew checkConsumer"

[tasks.readme]
description = "Print the README's Kotlin snippets into the consumer build, after changing one"
run = "./gradlew printReadmeSnippets"

# The ```kotlin fences of any Markdown documents, a documentation site's pages among them, compiled against the modules'
# public API for the jvm and Android, warnings as errors: `mise run snippets -- <file.md> [<file.md>...]`, each path read
# from the directory you run it in. Each fence is printed into consumer/build/generated/snippets, never committed, and a
# failing one is named by its document and line. The build names no document of its own, and no gate runs it.
[tasks.snippets]
description = "Compile the Kotlin fences of the Markdown documents named after --, for the jvm and Android"
run = "bash scripts/snippets.sh"

[tasks."api:update"]
description = "Rewrite the committed ABI dumps of every module, after a deliberate change to the public API"
run = "./gradlew updateKotlinAbi"

[tasks.conformance]
description = "Run every capability's fixture against this SDK"
run = "./gradlew conformance"

[tasks."conformance:report"]
description = "Run the fixtures and write the report into the sibling schemas checkout"
run = "./gradlew conformanceReport"

# A release is made where the whole gate runs: macOS for the iOS simulator suites, with the emulator
# booted for the device tests. The preflight runs the gate itself before anything is committed,
# signed or uploaded. `bash scripts/release.sh --help` says what it refuses and what it does, and
# `--dry-run` proves all of it but git and the upload.
[tasks.release]
description = "Release a version: the preflight and the gate, then the changelog, the tag, the deployment on the Central Portal, one atomic push of main and the tag to Entire, and the wait for the mirror"
run = "bash scripts/release.sh"

# What pre-commit runs: formatting, the only lint the Gradle build has on its own.
[tasks."ci:quick"]
description = "What pre-commit runs: ktlintCheck"
run = "./gradlew ktlintCheck"

[tasks.lint]
description = "ktlintCheck"
run = "./gradlew ktlintCheck"

[tasks.test]
description = "The JVM tests"
run = "./gradlew test"

[tasks.build]
description = "Assemble every module"
run = "./gradlew assemble"

[tasks.format]
description = "ktlintFormat"
run = "./gradlew ktlintFormat"
