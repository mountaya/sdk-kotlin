# The Kotlin compiler and the gates that parse sources run inside the daemon's workers.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true

kotlin.code.style=official

# A build never installs an Android SDK package: a missing platform or build tools fails it rather than being
# installed with its licence. `mise run android:packages` installs them, and it is the person's to run.
android.builder.sdkDownload=false
